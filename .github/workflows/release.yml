name: Release

# Tagging is the release: `git tag v0.2.0 && git push origin v0.2.0` builds the
# binaries and attaches them to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Two builds, because a binary that links libmpv is tied to the ABI of whatever
  # built it: Ubuntu 22.04 ships mpv 0.34 (`libmpv.so.1`), Arch ships 0.41
  # (`libmpv.so.2`). One artifact cannot serve both — the first attempt shipped an
  # "x86_64-linux" tarball that would not even start on the machine of the person
  # who asked for it. Hence: one per distribution, each named for it.
  ubuntu:
    # Deliberately *not* `ubuntu-latest`, and older than the CI's runner. A binary
    # is only as portable as the glibc it was linked against — built here it runs
    # on anything at least as new, and 22.04 is the oldest image GitHub still
    # offers. (Measured: the result wants GLIBC_2.34.)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libmpv-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgbm-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          # Named for what it needs, not for what built it. The filename says
          # mpv 0.34 (libmpv.so.1); the distribution that happened to produce it
          # is only in INSTALL.txt, because "ubuntu" in a filename reads as
          # "Ubuntu only" when the real constraint is a library.
          # Measure, do not guess: both numbers below come out of the binary.
          glibc=$(objdump -T target/release/niripaper | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 | sed 's/^GLIBC_//')
          soname=$(ldd target/release/niripaper | grep -oE 'libmpv\.so\.[0-9]+' | head -1)
          echo "  needs glibc $glibc, $soname"
          printf '%s\n' \
            "niripaper ${GITHUB_REF_NAME#v} — built on Ubuntu 22.04" \
            "" \
            "Needs: glibc >= $glibc, $soname (mpv 0.34), libEGL, libgbm, libwayland-client." \
            "Check with: ldd ./niripaper" \
            "" \
            "Works on anything with at least that glibc and mpv 0.34. On a system with" \
            "mpv 0.35 or newer (libmpv.so.2) take the other tarball." > INSTALL.txt
          tar czf "dist/niripaper-${{ github.ref_name }}-x86_64-linux-gnu-mpv0.34.tar.gz" \
            -C target/release niripaper \
            -C "$GITHUB_WORKSPACE" INSTALL.txt README.md README.zh-CN.md LICENSE
          tar tzf dist/*.tar.gz
          # The line that says which distributions this can actually run on.
          ldd target/release/niripaper | grep -E "libmpv|libEGL|libgbm|libwayland-client" || true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/attach-release.sh dist/*.tar.gz

  # The audience for a niri wallpaper daemon is on Arch, so this is the artifact
  # most people will actually use. A container rather than a runner, because
  # GitHub has no Arch image — and it doubles as the reason the build is
  # reproducible: the container's libmpv, not the runner's, is what it links.
  arch:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git pkgconf mpv libglvnd mesa wayland rust github-cli

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          # Measure, do not guess: both numbers below come out of the binary.
          glibc=$(objdump -T target/release/niripaper | grep -oE 'GLIBC_[0-9.]+' | sort -uV | tail -1 | sed 's/^GLIBC_//')
          soname=$(ldd target/release/niripaper | grep -oE 'libmpv\.so\.[0-9]+' | head -1)
          echo "  needs glibc $glibc, $soname"
          printf '%s\n' \
            "niripaper ${GITHUB_REF_NAME#v} — built on Arch" \
            "" \
            "Needs: glibc >= $glibc, $soname (mpv 0.41), libEGL, libgbm, libwayland-client." \
            "Check with: ldd ./niripaper" \
            "" \
            "Works on anything with at least that glibc and mpv 0.41. On a system with" \
            "mpv 0.34 (libmpv.so.1) take the other tarball." > INSTALL.txt
          tar czf "dist/niripaper-${{ github.ref_name }}-x86_64-linux-gnu-mpv0.41.tar.gz" \
            -C target/release niripaper \
            -C "$GITHUB_WORKSPACE" INSTALL.txt README.md README.zh-CN.md LICENSE
          tar tzf dist/*.tar.gz
          ldd target/release/niripaper | grep -E "libmpv|libEGL|libgbm|libwayland-client" || true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/attach-release.sh dist/*.tar.gz
