name: Release

# Tagging is the release: `git tag v0.2.0 && git push origin v0.2.0` builds the
# binary and attaches it to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Deliberately *not* `ubuntu-24.04`. A binary is only as portable as the glibc
    # it was linked against — built here, it runs on anything at least as new as
    # this runner and nothing older. 22.04 is the oldest image GitHub still
    # offers, which buys the widest range; the CI workflow stays on 24.04 because
    # a check has no such obligation.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Linked by hand (no crate wraps them): libmpv for the video render API,
      # libEGL/libGL for the renderer, libgbm for the dmabuf allocator,
      # libwayland-client for the layer surface.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libmpv-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgbm-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      # The tarball carries what a user needs to know what they have: the binary,
      # both READMEs, and the licence.
      - name: Package
        run: |
          mkdir -p dist
          tar czf "dist/niripaper-${{ github.ref_name }}-x86_64-linux.tar.gz" \
            -C target/release niripaper \
            -C "$GITHUB_WORKSPACE" README.md README.zh-CN.md LICENSE
          tar tzf dist/*.tar.gz

      # `gh` is preinstalled on the runner, so this needs no third-party action.
      # `--generate-notes` collects the merged pull requests, which is what the
      # milestone-shaped history in `main` is for.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/niripaper-*.tar.gz
