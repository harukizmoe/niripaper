name: CI

# The three checks AGENTS.md asks for before anything lands, plus a release build:
# `fmt` and `clippy` are the ones that rot quietly, and the release profile is what
# actually ships.
on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Pinned rather than `ubuntu-latest`: this project ships prebuilt binaries, so
    # the machine that builds them should be a decision, not whatever GitHub rolled
    # out this week. `ubuntu-latest` is slated to move to Ubuntu 26, where the
    # package names below may well have changed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The daemon links these by hand (no crate wraps them): libmpv for the video
      # render API, libEGL/libGL for the renderer, libgbm for the dmabuf
      # allocator, libwayland-client for the layer surface.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libmpv-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgbm-dev \
            libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # `-D warnings` rather than eyeballing it: the project has been at zero
      # warnings for a while, and a warning that nobody reads is a warning that
      # stays.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The tests are pure logic — no GPU, no compositor, no display — so they run
      # on a runner with none of those.
      - name: Tests
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

  app:
    # The desktop manager (Tauri v2): its Rust half needs webkit2gtk, its web
    # half needs Node. Kept in a separate job because `default-members` in the
    # workspace root deliberately excludes it — the checks above must stay
    # runnable on a GPU-free, display-less runner, and this one needs GUI
    # headers to compile.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: app

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Frontend dependencies
        working-directory: app/ui
        run: npm ci

      - name: Frontend build
        working-directory: app/ui
        run: npm run build

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -p niripaper-app --locked -- -D warnings

      - name: Build
        run: cargo build -p niripaper-app --locked
